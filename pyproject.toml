[project]
name = "camminady_matplotlib_theme"
version = "0.1.0"
description = "A minimal matplotlib style that matches camminady_altair_theme: muted gray text, dashed grid lines and horizontal axis titles."
authors = [
    { name = "Thomas Camminady", email = "0milieux_member@icloud.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["matplotlib", "style", "theme", "visualization", "charts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
]

[project.urls]
Homepage = "https://github.com/thomascamminady/camminady_matplotlib_theme"
Documentation = "https://camminady.dev/camminady_matplotlib_theme/"
Repository = "https://github.com/thomascamminady/camminady_matplotlib_theme"
Issues = "https://github.com/thomascamminady/camminady_matplotlib_theme/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "camminady-altair-theme>=0.2.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.3.0",
    "ruff>=0.15.20",
    "ty>=0.0.57",
    "vega-datasets>=0.9.0",
    "vl-convert-python>=1.9.0",
]
docs = [
    "pdoc>=14.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
