name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and test (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --no-fix .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest

  compatibility:
    name: Test (Python ${{ matrix.python }}, matplotlib${{ matrix.matplotlib }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.11", "3.12", "3.13", "3.14" ]
        matplotlib: [ "==3.10.0", ">=3.10" ]
        # matplotlib 3.10.0 has no wheels for Python 3.14.
        exclude:
          - python: "3.14"
            matplotlib: "==3.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Test against the oldest and the newest supported matplotlib
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python }}
          --with-editable . --with "matplotlib${{ matrix.matplotlib }}"
          --with pytest --with vl-convert-python --with camminady-altair-theme
          --with vega-datasets
          python -m pytest
