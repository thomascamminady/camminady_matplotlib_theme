repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: '.*\.(txt|csv)'
      - id: end-of-file-fixer
        exclude: '.*\.(txt|csv)'
      - id: check-yaml
        exclude: '.*\.(txt|csv)'

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: pyupgrade (.py files)
        args: [ '--py311-plus' ]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: nbstripout (.ipynb files)

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-pyupgrade
        args: [ '--py311-plus' ]
        name: pyupgrade (.ipynb files)
      - id: nbqa-ruff
        name: ruff (.ipynb files)
        args: [ "--fix", "--exit-non-zero-on-fix" ]

  # Keep in sync with the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.0'
    hooks:
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.23
    hooks:
      - id: uv-lock
        name: uv-lock
        description: Update uv.lock file

  - repo: local
    hooks:
      - id: pyclean
        name: pyclean
        entry: uvx pyclean .
        language: system
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: uv run --frozen ty check
        language: system
        types: [ python ]
        pass_filenames: false

      # `uv run`, not `uvx`: the tests need the project and its dependencies.
      - id: pytest-check
        name: pytest-check
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
